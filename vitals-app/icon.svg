<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a5f" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#1e293b" stroke-width="8"/>
  <!-- Circular ambient glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ff2a5f" stroke-width="2" opacity="0.25" stroke-dasharray="8 8" />
  <!-- Stylized Heart + ECG -->
  <path d="M256 390 C150 300 130 220 170 170 C205 130 250 145 256 180 C262 145 307 130 342 170 C382 220 362 300 256 390 Z" fill="#ff2a5f" opacity="0.15"/>
  <path d="M120 260 L180 260 L205 200 L235 320 L265 190 L290 290 L315 250 L335 260 L392 260" fill="none" stroke="url(#pulse)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="265" cy="190" r="8" fill="#00f0ff" filter="url(#glow)"/>
</svg>
